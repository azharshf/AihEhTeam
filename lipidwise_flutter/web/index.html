<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lipidwise_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>lipidwise_flutter</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Real, on-device OCR engine (Tesseract.js) used by the Smart Medical
    Record Scanner. This actually reads pixels from the photo/file the user
    provides and returns recognized text — nothing here is pre-scripted.
    See lib/services/ocr_service_web.dart for the Dart side of the bridge.
  -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script>
    // Lazily created and reused so repeat scans don't reload the OCR worker.
    window._lipidwiseOcrWorkerPromise = null;

    function _lipidwiseGetOcrWorker() {
      if (!window._lipidwiseOcrWorkerPromise) {
        window._lipidwiseOcrWorkerPromise = Tesseract.createWorker('eng');
      }
      return window._lipidwiseOcrWorkerPromise;
    }

    // Called from Dart via dart:js_interop (see ocr_service_web.dart).
    // Takes a data: URL of the captured/selected image and resolves with
    // the raw text Tesseract actually recognized in that image.
    window.lipidwiseRunOcr = function (dataUrl) {
      return _lipidwiseGetOcrWorker()
        .then(function (worker) {
          return worker.recognize(dataUrl);
        })
        .then(function (result) {
          return (result && result.data && result.data.text) || '';
        })
        .catch(function (err) {
          console.error('LipidWise OCR error:', err);
          throw err;
        });
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
